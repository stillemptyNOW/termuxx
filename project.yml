name: Termuxx
options:
  bundleIdPrefix: com.stillempty
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.12.3
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh
    minorVersion: 0.3.4

targets:
  Termuxx:
    type: application
    platform: iOS
    sources:
      - path: Termuxx
    scheme: {}
    info:
      path: Termuxx/Info.plist
      properties:
        CFBundleDisplayName: Termuxx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Termuxx использует Face ID, чтобы защитить ваши серверы и ключи.
        NSLocalNetworkUsageDescription: Termuxx подключается к серверам в вашей локальной сети по SSH.
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillempty.termuxx
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio
        product: NIO
      - package: swift-crypto
        product: Crypto
      - package: swift-nio-ssh
        product: NIOSSH
