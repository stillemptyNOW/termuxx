name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (.ipa)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi -e beta -e release_candidate | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Termuxx.xcodeproj \
            -scheme Termuxx \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/Termuxx.app/Termuxx

      - name: Package IPA
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/Termuxx.app Payload/
          zip -qry dist/Termuxx.ipa Payload
          ls -lh dist/Termuxx.ipa

      - name: Collect log
        if: always()
        run: |
          mkdir -p logs
          {
            echo "ios run: ${{ github.run_number }} sha: ${{ github.sha }}"
            xcodebuild -version || true
            grep -E "error:" build.log | sort -u | head -200 || true
            echo "------ tail ------"
            tail -60 build.log || true
          } > logs/ci-log-ios.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            dist/Termuxx.ipa
            logs/ci-log-ios.txt
          if-no-files-found: ignore

  linux:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare
        run: |
          pacman -Syu --noconfirm --needed git xorg-server-xvfb xorg-xauth dbus
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          set -o pipefail
          mkdir -p logs dist
          git config --global --add safe.directory '*'
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd linux/packaging
          sed -i "s|git+https://github.com/stillemptyNOW/termuxx.git|git+file://$GITHUB_WORKSPACE|" PKGBUILD
          sudo -H -u builder git config --global --add safe.directory '*'
          sudo -H -u builder makepkg -s --noconfirm 2>&1 | tee "$GITHUB_WORKSPACE/logs/makepkg.log"
          cp *.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Smoke test
        run: |
          set -o pipefail
          pacman -U --noconfirm dist/*.pkg.tar.zst
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" timeout 60 termuxx --smoke-test 2>&1 | tee logs/smoke.log

      - name: Collect log
        if: always()
        run: |
          {
            echo "linux run: ${{ github.run_number }} sha: ${{ github.sha }}"
            echo "------ makepkg ------"
            tail -80 logs/makepkg.log 2>/dev/null || true
            echo "------ smoke ------"
            tail -80 logs/smoke.log 2>/dev/null || true
          } > logs/ci-log-linux.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: |
            dist/*.pkg.tar.zst
            logs/ci-log-linux.txt
          if-no-files-found: ignore

  release:
    name: Release
    needs: [ios, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge logs
        run: |
          ls -R artifacts || true
          {
            echo "ios: ${{ needs.ios.result }} | linux: ${{ needs.linux.result }}"
            echo
            cat artifacts/logs/ci-log-ios.txt 2>/dev/null || echo "(no ios log)"
            echo
            echo "=================================================="
            cat artifacts/logs/ci-log-linux.txt 2>/dev/null || echo "(no linux log)"
          } > ci-log.txt

      - name: Upload CI log
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI log
          prerelease: true
          make_latest: false
          files: ci-log.txt

      - name: Remove old releases
        if: needs.ios.result == 'success' || needs.linux.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | grep '^v1\.' | while read tag; do
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

      - name: Release
        if: needs.ios.result == 'success' || needs.linux.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Termuxx 1.1 (build ${{ github.run_number }})
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            **iOS:** `Termuxx.ipa` — неподписанный, подпишите через eSign, Sideloadly, AltStore или TrollStore. Liquid Glass на iOS 26+.
            **Arch Linux:** `termuxx-git-*.pkg.tar.zst` — установка: `sudo pacman -U termuxx-git-*.pkg.tar.zst`.

            Статус сборки: iOS — ${{ needs.ios.result }}, Linux — ${{ needs.linux.result }}.
          files: |
            artifacts/dist/Termuxx.ipa
            artifacts/dist/*.pkg.tar.zst
